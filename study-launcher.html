<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>防詐學習研究｜施測入口</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; background:#eef3f8; color:#172033; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
    main { width:min(560px,100%); background:#fff; border:1px solid #d8e0ea; border-radius:20px; padding:28px; box-shadow:0 18px 48px rgba(35,52,78,.12); }
    h1 { margin:0 0 8px; font-size:clamp(1.55rem,6vw,2rem); }
    .lead { margin:0 0 24px; color:#526079; line-height:1.7; }
    .card { border:1px solid #d8e0ea; border-radius:14px; padding:18px; background:#f8fafc; }
    .label { margin:0 0 6px; color:#66738a; font-size:.9rem; }
    .value { margin:0; font-weight:800; font-size:1.35rem; letter-spacing:.04em; overflow-wrap:anywhere; }
    .code-row { display:flex; align-items:center; gap:12px; }
    .code-row .card { flex:1; }
    .group-card { margin-top:14px; }
    button, a.button { min-height:48px; border:0; border-radius:12px; padding:12px 18px; font:inherit; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    button.secondary, a.secondary { background:#e7edf5; color:#1b355c; }
    .primary { width:100%; margin-top:20px; color:#fff; background:#1557b0; }
    a.secondary { width:100%; margin-top:10px; }
    .notice { margin:18px 0 0; padding:14px 16px; border-radius:12px; background:#fff7df; color:#5d4300; line-height:1.6; }
    .waiting { background:#eaf2ff; color:#1b355c; }
    .error { background:#ffebeb; color:#842323; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <main>
    <h1>防詐學習研究</h1>
    <p class="lead">請先記下受試者代碼並完成前測。系統已自動為你分組，送出前測後才會顯示組別，再依組別進入遊戲或影片。全程請使用同一個瀏覽器。</p>

    <section id="assignment" class="hidden" aria-live="polite">
      <div class="code-row">
        <div class="card">
          <p class="label">受試者代碼</p>
          <p id="participant-code" class="value"></p>
        </div>
        <button id="copy-code" class="secondary" type="button">複製</button>
      </div>
      <div id="group-card" class="card group-card hidden">
        <p class="label">你的組別</p>
        <p id="group-label" class="value"></p>
      </div>
      <a id="primary-action" class="button primary" href="#">開始前測</a>
      <button id="pretest-done" class="primary hidden" type="button">我已送出前測，查看我的組別</button>
      <a id="reopen-pretest" class="button secondary hidden" href="#" target="_blank" rel="noopener">重新開啟前測</a>
      <p id="status" class="notice">前測會在新分頁開啟。送出後請回到本頁。</p>
    </section>

    <p id="error" class="notice error hidden" role="alert"></p>
  </main>

  <script>
  /* STUDY_LAUNCHER_CORE_START */
  const STUDY_LAUNCHER_CORE = Object.freeze({
    alphabet: '23456789ABCDEFGHJKLMNPQRSTUVWXYZ',
    storageKey: 'midnight-study-assignment-v1',
    unassignedLabel: '未分組',
    normalizeGroup(value) {
      if (value === 'game' || value === 'video') return value;
      throw new Error('invalid_group');
    },
    createParticipantCode(randomBytes) {
      const source = randomBytes || (length => crypto.getRandomValues(new Uint8Array(length)));
      const bytes = source(6);
      if (!bytes || bytes.length !== 6) throw new Error('invalid_random_bytes');
      return `P-${[...bytes].map(value => this.alphabet[Number(value) % this.alphabet.length]).join('')}`;
    },
    // P- 為中性代碼（組別另存，不寫在代碼裡）；G-/V- 為舊版抽籤代碼，只在組別相符時沿用。
    validAssignment(parsed) {
      const code = String(parsed?.participantCode || '');
      const group = parsed?.group ?? null;
      const body = '[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}';
      const ok = (new RegExp(`^P-${body}$`).test(code) && [null, 'game', 'video'].includes(group))
        || (new RegExp(`^G-${body}$`).test(code) && group === 'game')
        || (new RegExp(`^V-${body}$`).test(code) && group === 'video');
      if (!ok) throw new Error('invalid_assignment');
      return Object.freeze({ participantCode: code, group });
    },
    readAssignment(storage) {
      const raw = storage.getItem(this.storageKey);
      if (!raw) return null;
      let parsed;
      try { parsed = JSON.parse(raw); } catch (error) { throw new Error('invalid_assignment'); }
      return this.validAssignment(parsed);
    },
    claimAssignment(storage, randomBytes) {
      const existing = this.readAssignment(storage);
      if (existing) return existing;
      const assignment = Object.freeze({ participantCode: this.createParticipantCode(randomBytes), group: null });
      storage.setItem(this.storageKey, JSON.stringify(assignment));
      return assignment;
    },
    saveGroup(storage, assignment, group) {
      const normalized = this.normalizeGroup(group);
      if (assignment.group && assignment.group !== normalized) throw new Error('group_conflict');
      const next = Object.freeze({ participantCode: assignment.participantCode, group: normalized });
      storage.setItem(this.storageKey, JSON.stringify(next));
      return next;
    },
    parseAssignment(response) {
      if (response && response.ok === true && response.status === 'assigned' && ['game', 'video'].includes(response.group)) return { status: 'assigned', group: response.group };
      return { status: 'error', group: null };
    },
    // 前測永遠帶「未分組」：組別在掃碼時已分好，但要等送出前測才揭露。
    buildPretestUrl(config, assignment) {
      return this.buildPrefilledUrl(config.pretestUrl, config.pretestEntryMap, { participantCode: assignment.participantCode, group: null });
    },
    buildPrefilledUrl(baseUrl, entryMap, assignment) {
      const url = new URL(baseUrl);
      if (url.protocol !== 'https:' || url.hostname !== 'docs.google.com' || !url.pathname.endsWith('/viewform')) throw new Error('invalid_form_url');
      if (!entryMap.participantCode || !entryMap.group || entryMap.participantCode === entryMap.group) throw new Error('invalid_entry_map');
      url.searchParams.set(entryMap.participantCode, assignment.participantCode);
      url.searchParams.set(entryMap.group, assignment.group || this.unassignedLabel);
      url.searchParams.set('usp', 'pp_url');
      return url.toString();
    },
    buildInterventionUrl(baseHref, config, assignment) {
      if (!assignment.group) throw new Error('not_allocated');
      const url = new URL(assignment.group === 'game' ? config.gameUrl : config.videoUrl, baseHref);
      url.searchParams.set('mode', 'study');
      url.searchParams.set('participantCode', assignment.participantCode);
      url.searchParams.set('group', assignment.group);
      return url.toString();
    }
  });
  /* STUDY_LAUNCHER_CORE_END */

  const LAUNCH_CONFIG = Object.freeze({
    pretestUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSfWHqyVnSiS3t-Tt_TvDAET9O2Kun0rStciFl23rE7YcjOF4w/viewform',
    pretestEntryMap: Object.freeze({ participantCode: 'entry.796152856', group: 'entry.128154823' }),
    allocationEndpoint: 'https://script.google.com/macros/s/AKfycbzFgPfUFIPEjHsamvnfC2HwBsjEJqLExZhaJFoIYdzM4DzW1Zu_lmFjBDRT1TTpkDaIJg/exec',
    gameUrl: './v46.html',
    videoUrl: './video-intervention.html'
  });
  const PRETEST_OPENED_KEY = 'midnight-study-pretest-opened-v1';
  const PRETEST_DONE_KEY = 'midnight-study-pretest-done-v1';

  (function init() {
    const el = id => document.getElementById(id);
    const errorBox = el('error');
    const status = el('status');
    const action = el('primary-action');
    const doneButton = el('pretest-done');
    const reopen = el('reopen-pretest');
    const flag = key => { try { return localStorage.getItem(key) === 'yes'; } catch (error) { return false; } };
    const setFlag = key => { try { localStorage.setItem(key, 'yes'); } catch (error) {} };
    let assignment;
    let assignTimer = null;

    function showError(code) {
      const messages = {
        invalid_assignment: '此裝置的研究代碼資料異常，請交由研究人員處理。',
        group_conflict: '此裝置的分組資料與系統不一致，請交由研究人員處理。',
        invalid_form_url: '前測表單尚未設定完成，請通知研究人員。',
        invalid_entry_map: '前測欄位尚未設定完成，請通知研究人員。'
      };
      errorBox.textContent = messages[code] || '無法啟動施測，請通知研究人員。';
      errorBox.classList.remove('hidden');
    }

    function render() {
      el('participant-code').textContent = assignment.participantCode;
      [action, doneButton, reopen, el('group-card')].forEach(node => node.classList.add('hidden'));
      status.className = 'notice';
      const pretestUrl = STUDY_LAUNCHER_CORE.buildPretestUrl(LAUNCH_CONFIG, assignment);
      reopen.href = pretestUrl;
      if (flag(PRETEST_DONE_KEY)) {
        if (!assignment.group) {
          reopen.classList.remove('hidden');
          status.className = 'notice waiting';
          status.textContent = '系統分組中，請稍候幾秒（請保持網路連線）。';
          return;
        }
        el('group-label').textContent = assignment.group === 'game' ? '遊戲組' : '影片組';
        el('group-card').classList.remove('hidden');
        action.textContent = assignment.group === 'game' ? '開始遊戲' : '開始觀看影片';
        action.removeAttribute('target');
        action.href = STUDY_LAUNCHER_CORE.buildInterventionUrl(location.href, LAUNCH_CONFIG, assignment);
        action.classList.remove('hidden');
        status.textContent = '學習活動結束後，系統會帶你前往後測。';
        return;
      }
      if (flag(PRETEST_OPENED_KEY)) {
        doneButton.classList.remove('hidden');
        reopen.classList.remove('hidden');
        status.textContent = '請確認前測已按下「提交」，再按上方按鈕查看你的組別。';
        return;
      }
      action.textContent = '開始前測';
      action.href = pretestUrl;
      action.target = '_blank';
      action.rel = 'noopener';
      action.classList.remove('hidden');
      status.textContent = '前測會在新分頁開啟。送出後請回到本頁。';
    }

    // 掃碼當下就向伺服器取得組別（依區組亂數序列），先存起來，送出前測後才顯示。
    async function requestAssignment() {
      assignTimer = null;
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 15000) : null;
      let result = { status: 'error', group: null };
      try {
        const url = `${LAUNCH_CONFIG.allocationEndpoint}?action=assign&code=${encodeURIComponent(assignment.participantCode)}&t=${Date.now()}`;
        const response = await fetch(url, { cache: 'no-store', signal: controller?.signal });
        result = STUDY_LAUNCHER_CORE.parseAssignment(response.ok ? await response.json() : null);
      } catch (error) {
        result = { status: 'error', group: null };
      } finally {
        if (timer) clearTimeout(timer);
      }
      if (result.status === 'assigned') {
        try { assignment = STUDY_LAUNCHER_CORE.saveGroup(localStorage, assignment, result.group); render(); }
        catch (error) { showError(error.message); }
        return;
      }
      assignTimer = setTimeout(requestAssignment, 5000 + Math.floor(Math.random() * 3000));
    }

    try {
      assignment = STUDY_LAUNCHER_CORE.claimAssignment(localStorage);
      el('copy-code').addEventListener('click', async event => {
        try { await navigator.clipboard.writeText(assignment.participantCode); event.currentTarget.textContent = '已複製'; } catch (error) {}
      });
      action.addEventListener('click', () => { if (!flag(PRETEST_DONE_KEY)) { setFlag(PRETEST_OPENED_KEY); setTimeout(render, 300); } });
      reopen.addEventListener('click', () => setFlag(PRETEST_OPENED_KEY));
      doneButton.addEventListener('click', () => { setFlag(PRETEST_DONE_KEY); render(); });
      render();
      el('assignment').classList.remove('hidden');
      // 錯開第一次請求（0–4 秒），避免整班同時掃碼時瞬間湧入伺服器。
      if (!assignment.group) assignTimer = setTimeout(requestAssignment, Math.floor(Math.random() * 4000));
    } catch (error) {
      showError(error.message);
    }
  })();
  </script>
</body>
</html>
