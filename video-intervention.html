<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>防詐學習研究｜影片組</title>
  <style>
    :root { font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; color:#172033; background:#eef3f8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; }
    main { width:min(900px,100%); margin:auto; background:#fff; border:1px solid #d8e0ea; border-radius:20px; padding:24px; box-shadow:0 18px 48px rgba(35,52,78,.12); }
    h1 { margin:0 0 8px; }
    .meta { color:#53627a; line-height:1.65; }
    .code { font-weight:800; color:#1557b0; }
    .player-shell { position:relative; aspect-ratio:16/9; width:100%; margin:22px 0; border-radius:14px; overflow:hidden; background:#10141d; }
    #player { width:100%; height:100%; }
    .progress { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:18px 0; }
    .step { padding:10px 4px; border-radius:10px; background:#e6ebf2; text-align:center; font-weight:700; color:#5d6a7f; }
    .step.current { background:#1557b0; color:white; }
    .step.done { background:#daf2e2; color:#14632f; }
    button, a { min-height:48px; border:0; border-radius:12px; padding:12px 18px; font:inherit; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    button { background:#1557b0; color:#fff; cursor:pointer; }
    a { width:100%; background:#14632f; color:#fff; }
    .notice { padding:14px 16px; border-radius:12px; background:#fff7df; color:#5d4300; line-height:1.6; }
    .error { background:#ffebeb; color:#842323; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main>
    <h1>影片組學習活動</h1>
    <p class="meta">受試者代碼：<span id="participant-code" class="code"></span><br>請依序完整觀看五支影片，共 6 分 16 秒。播放完一支後，系統會自動進入下一支。</p>
    <div class="progress" aria-label="影片進度">
      <div class="step">1</div><div class="step">2</div><div class="step">3</div><div class="step">4</div><div class="step">5</div>
    </div>
    <div class="player-shell"><div id="player"></div></div>
    <button id="start" type="button">開始播放第 1 支影片</button>
    <p id="status" class="notice" role="status" aria-live="polite">按下開始後，請保持本頁開啟。</p>
    <a id="posttest" class="hidden" href="#" target="_blank" rel="noopener">五支影片已完成，前往後測</a>
    <p id="error" class="notice error hidden" role="alert"></p>
  </main>

  <script>
  /* VIDEO_INTERVENTION_CORE_START */
  const VIDEO_INTERVENTION_CORE = Object.freeze({
    videos: Object.freeze([
      Object.freeze({ id:'k5tovaERJL0', seconds:77 }),
      Object.freeze({ id:'N4UJClTQB5s', seconds:67 }),
      Object.freeze({ id:'PTqlXB7FPws', seconds:55 }),
      Object.freeze({ id:'JO5AwtpuoSI', seconds:90 }),
      Object.freeze({ id:'hqEZRCtqfbI', seconds:87 })
    ]),
    posttestUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSfb16N0But4fDgb5dIEdN4uMF1yRNcg17sHB1emVecyvyg-sw/viewform',
    entryMap: Object.freeze({ participantCode:'entry.1008091060', group:'entry.532949578' }),
    validateAssignment(participantCode, group) {
      const code = String(participantCode || '').trim().toUpperCase();
      if (group !== 'video') throw new Error('video_group_required');
      if (!/^[VP]-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$/.test(code)) {
        if (/^G-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$/.test(code)) throw new Error('participant_group_mismatch');
        throw new Error('invalid_participant_code');
      }
      return Object.freeze({ participantCode:code, group:'video' });
    },
    // 影片獨立連結：網址沒帶代碼時，讀取同一支手機在問卷入口拿到的代碼與組別；要先在入口按過「我已送出前測」。
    resolveAssignment(params, storage) {
      const code = params.get('participantCode');
      const group = params.get('group');
      if (code || group) return this.validateAssignment(code, group);
      let stored = null;
      try { stored = JSON.parse(storage.getItem('midnight-study-assignment-v1') || 'null'); } catch (error) { stored = null; }
      if (!stored || !stored.participantCode || !stored.group) throw new Error('missing_assignment');
      if (storage.getItem('midnight-study-pretest-done-v1') !== 'yes') throw new Error('pretest_pending');
      return this.validateAssignment(stored.participantCode, stored.group);
    },
    buildPosttestUrl(assignment) {
      const valid = this.validateAssignment(assignment.participantCode, assignment.group);
      const url = new URL(this.posttestUrl);
      url.searchParams.set(this.entryMap.participantCode, valid.participantCode);
      url.searchParams.set(this.entryMap.group, valid.group);
      url.searchParams.set('usp', 'pp_url');
      return url.toString();
    }
  });
  /* VIDEO_INTERVENTION_CORE_END */

  let player = null;
  let currentIndex = 0;
  let assignment = null;
  let started = false;

  function progressKey() { return `midnight-video-progress-v1:${assignment.participantCode}`; }
  function saveProgress(value) { localStorage.setItem(progressKey(), JSON.stringify(value)); }
  function readProgress() {
    try { return JSON.parse(localStorage.getItem(progressKey()) || 'null'); }
    catch (error) { return null; }
  }
  function renderProgress() {
    document.querySelectorAll('.step').forEach((step, index) => {
      step.classList.toggle('done', index < currentIndex);
      step.classList.toggle('current', index === currentIndex && currentIndex < VIDEO_INTERVENTION_CORE.videos.length);
    });
  }
  function finishIntervention() {
    currentIndex = VIDEO_INTERVENTION_CORE.videos.length;
    saveProgress({ completed:true, completedAt:new Date().toISOString(), currentIndex });
    renderProgress();
    document.querySelector('.player-shell').classList.add('hidden');
    document.getElementById('start').classList.add('hidden');
    document.getElementById('status').textContent = '五支影片均已播放完成。請開啟後測並確認代碼。';
    const link = document.getElementById('posttest');
    link.href = VIDEO_INTERVENTION_CORE.buildPosttestUrl(assignment);
    link.classList.remove('hidden');
  }
  function loadCurrentVideo() {
    renderProgress();
    const video = VIDEO_INTERVENTION_CORE.videos[currentIndex];
    if (!video) { finishIntervention(); return; }
    document.getElementById('status').textContent = `正在播放第 ${currentIndex + 1} 支，共 5 支。`;
    player.loadVideoById(video.id);
  }
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width:'100%', height:'100%', videoId:VIDEO_INTERVENTION_CORE.videos[currentIndex].id,
      playerVars:{ controls:0, disablekb:1, rel:0, playsinline:1, modestbranding:1 },
      events:{
        onReady() { document.getElementById('start').disabled = false; },
        onStateChange(event) {
          if (event.data === YT.PlayerState.ENDED) {
            currentIndex += 1;
            saveProgress({ completed:false, currentIndex });
            loadCurrentVideo();
          }
        },
        onError() { document.getElementById('error').textContent = '影片載入失敗，請通知研究人員。'; document.getElementById('error').classList.remove('hidden'); }
      }
    });
  }

  (function init() {
    try {
      const params = new URLSearchParams(location.search);
      assignment = VIDEO_INTERVENTION_CORE.resolveAssignment(params, localStorage);
      document.getElementById('participant-code').textContent = assignment.participantCode;
      const saved = readProgress();
      if (saved?.completed) { finishIntervention(); return; }
      currentIndex = Math.max(0, Math.min(4, Number(saved?.currentIndex) || 0));
      renderProgress();
      document.getElementById('start').disabled = true;
      document.getElementById('start').addEventListener('click', () => {
        if (started || !player) return;
        started = true;
        document.getElementById('start').classList.add('hidden');
        player.playVideo();
      });
      const api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(api);
    } catch (error) {
      const messages = {
        missing_assignment: '找不到這支手機的受試者代碼，請先掃描問卷 QR Code 並完成前測。',
        pretest_pending: '請先完成前測，並在問卷入口頁按「我已送出前測」後再開啟影片。',
        video_group_required: '你的組別不是影片組，請回到問卷入口頁，依畫面上的按鈕進入你的學習活動。'
      };
      document.getElementById('error').textContent = messages[error.message] || '影片組連結無效，請向研究人員索取正確 QR Code。';
      document.getElementById('error').classList.remove('hidden');
      document.querySelector('.player-shell').classList.add('hidden');
      document.getElementById('start').classList.add('hidden');
    }
  })();
  </script>
</body>
</html>
